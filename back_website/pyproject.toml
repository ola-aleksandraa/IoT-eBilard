[project]
name = "iot-ebilard-website"
version = "1.0.0"
description = "Website backend: configuration, numerical shot planning/simulation and the table state database fed by the camera watcher"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "cryptography>=42",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
