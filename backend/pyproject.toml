[project]
name = "iot-ebilard-backend"
version = "1.0.0"
description = "Numerical FastAPI backend for deterministic pool-ball recognition and projective table coordinates"
requires-python = ">=3.7.3,<3.8"
dependencies = [
  "fastapi==0.103.2",
  "pydantic==1.10.13",
  "starlette==0.27.0",
  "uvicorn==0.20.0",
  "python-multipart==0.0.6",
  "numpy==1.21.6",
  "pillow==5.4.1",
  "typing-extensions==4.7.1",
  "anyio==3.7.1",
]

[project.optional-dependencies]
test = ["pytest==7.4.4", "httpx==0.24.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64,<68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
